<template id="list-item"><li>{{value}}</li></template>

<template id="report-findings"
  ><ul class="sub upside-axes">
    {{items}}
  </ul></template
>

<template id="report-finding"
  ><li>
    <span class="axis-name">{{title}}</span><span class="axis-reason">{{content}}</span>
    <div>{{evidence}}</div>
    {{assumptions}}
  </li></template
>

<template id="report-badge"><span class="badge {{className}}">{{value}}</span></template>

<template id="report-card"
  ><li class="card">
    <div class="card-head">
      <span class="rank">{{rank}}</span>
      <h3>{{company}} — {{title}}</h3>
    </div>
    <dl class="fields">{{fields}}</dl>
  </li></template
>

<template id="report-cards"
  ><ol class="cards">
    {{cards}}
  </ol></template
>

<template id="report-ranking"
  ><ol class="ranking">
    {{items}}
  </ol></template
>

<template id="report-ranking-item"
  ><li>
    <span class="ranking-number">{{rank}}</span>
    <span class="ranking-position"
      ><strong>{{company}}</strong> — <a href="{{url}}">{{title}}</a></span
    >
    <span class="ranking-note">{{note}}</span>
  </li></template
>

<template id="report-code"><code>{{value}}</code></template>

<template id="report-content">{{sections}}</template>

<template id="report-section"
  ><section>
    <h2>{{title}}</h2>
    {{content}}
  </section></template
>

<template id="report-empty"><p class="empty">해당 없음</p></template>

<template id="report-field"
  ><dt>{{label}}</dt>
  <dd>{{value}}</dd></template
>

<template id="report-hold"
  ><li class="card hold">
    <div class="card-head"><h3>{{company}} — {{title}}</h3></div>
    <dl class="fields">
      <dt>링크</dt>
      <dd>{{link}}</dd>
      <dt>보류 이유</dt>
      <dd>{{reason}}</dd>
    </dl>
  </li></template
>

<template id="report-link"><a href="{{url}}">{{url}}</a></template>

<template id="report-list"
  ><ul>
    {{items}}
  </ul></template
>

<template id="report-sub-list"
  ><ul class="sub">
    {{items}}
  </ul></template
>

<template id="report-target"
  ><li class="card lead">
    <div class="card-head"><h3>{{company}}</h3></div>
    <dl class="fields">
      <dt>탐색 링크</dt>
      <dd>{{link}}</dd>
      <dt>추가 수집 이유</dt>
      <dd>{{reason}}</dd>
      <dt>다음 수집 포인트</dt>
      <dd>{{nextCollectionPoint}}</dd>
    </dl>
  </li></template
>

<template id="report-tier"
  ><h2 class="{{className}}">{{title}}</h2>
  {{content}}</template
>
