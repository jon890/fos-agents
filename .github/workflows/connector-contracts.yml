name: 커넥터 계약 검증

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: connector-contracts-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: ${{ matrix.workspace }} 계약 검증
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [accountbook, career-os]
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bun 설치
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: 커리어 대조 테스트의 루트 의존성 설치
        if: matrix.workspace == 'career-os'
        run: bun install --frozen-lockfile
      - name: plugin 의존성 설치
        run: bun install --frozen-lockfile --cwd ${{ matrix.workspace }}/plugin
      - name: 가계부 mock·SDK·정책 회귀 검사
        if: matrix.workspace == 'accountbook'
        run: bun test ./accountbook/plugin
      - name: 커리어 mock·SDK·정책 회귀 검사
        if: matrix.workspace == 'career-os'
        run: bun test ./career-os/plugin ./career-os/scripts/agent-usage ./career-os/scripts/interview-drill ./career-os/scripts/plugin-local
      - name: 타입 검사
        run: bun run --cwd ${{ matrix.workspace }}/plugin typecheck
